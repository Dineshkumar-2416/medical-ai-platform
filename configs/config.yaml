project:
  name: medical-ai-platform
  version: "1.0.0"

data:
  raw_dir: data/raw
  processed_dir: data/processed
  image_size: 224
  num_classes: 2
  class_names: ["NORMAL", "PNEUMONIA"]

training:
  model: resnet18
  pretrained: true
  batch_size: 32
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 4
  val_split: 0.2
  seed: 42
  device: cuda
  mixed_precision: true
  early_stopping_patience: 5
  checkpoint_dir: checkpoints

augmentation:
  train:
    horizontal_flip: true
    rotation_limit: 10
    brightness_contrast: true
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]
  val:
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]

model:
  resnet18:
    backbone: resnet18
    dropout: 0.3
    freeze_layers: 6
  efficientnet_b0:
    backbone: efficientnet_b0
    dropout: 0.3
    freeze_layers: 0

inference:
  confidence_threshold: 0.7
  low_confidence_warning: 0.6
  batch_size: 1

api:
  host: 0.0.0.0
  port: 8000
  max_upload_size_mb: 10
  allowed_extensions: [".jpg", ".jpeg", ".png", ".dcm"]

database:
  url: ${DATABASE_URL}

mlflow:
  tracking_uri: mlruns
  experiment_name: chest-xray-pneumonia

monitoring:
  prometheus_port: 9090
